<html>
  <head>
    <link
      href="https://fonts.googleapis.com/icon?family=/Material+Icons"
      rel="styleheet"
    />
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      rel="styleheet"
    />
  </head>

  <body>
    <div
      class="card"
      style="
        width: auto;
        height: auto;
        margin: 20 auto;
        font-family: Arial, sans-serif;
        background-color: #f0f1f5;
      "
    >
      <div class="card-body">
        <div
          style="
            height: auto;
            margin: 0 auto;
            padding: 8;
            background-color: white;
          "
        >
          <div
            align="center"
            style="
              margin-top: 50px;
              border-color: blue;
              border-radius: 20px;
              border-width: 20px;
            "
          >
            <h3 style="font-size: 50px; color: red; font-style: oblique">
              <b><b>BLOG</b></b>
            </h3>
            <p style="font-style: italic; font-size: 12px">
              A framework tool to measure , monitor and analyze and actionize
            </p>
          </div>
          <div align="center">
            <span class="material-icon" style="color: blueviolet"> email</span>
          </div>
          <div align="center">
            <h3>
              <b>Congrats, you are invited</b>
            </h3>
          </div>
          <div align="center">
            <p style="font-size: 16px">Signup OTP</p>
            <a href="{otpLink}">
              <button
                style="
                  background-color: blue;
                  color: white;
                  border: none;
                  font-size: 20px;
                  border-radius: 4px;
                  padding: 8px 17px 8px 17px;
                "
              >
                {otp}
              </button></a
            >
          </div>
          <br />
          <div align="center">
            <p style="font-size: 12px; word-wrap: break-word; opacity: 0.6">
              {otp}
            </p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
