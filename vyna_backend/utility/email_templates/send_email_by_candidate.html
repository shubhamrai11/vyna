<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{subject}</title>
    <link href="https://fonts.googleapis.com/css2?family=Arial&display=swap" rel="stylesheet" />
  </head>

  <body style="background-color: #eef2f7; font-family: Arial, sans-serif; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); padding: 25px;">
      
      <!-- Header -->
      <div style="text-align: center; margin-bottom: 20px;">
        <h3 style="font-size: 20px; color: #0f5a94; font-weight: bold;">ARPCE</h3>
        <img src="https://fetch-delivery.s3.amazonaws.com/avatar1747917171074.png" 
          alt="Logo" 
          style="width: 90px; height: auto; margin-bottom: 10px;" />
      </div>

      <!-- Greeting -->
      <p style="font-size: 16px; color: #333;">
        <strong>Salut {candidate_name},</strong>
      </p>
      <p style="font-size: 16px; color: #333;">
        {message}
      </p>

      <!-- Footer -->
      <p style="font-size: 14px; color: #777; text-align: center; margin-top: 20px;">
        Cordialement, <br />
        <strong>ARPCE Team</strong>
      </p>
    </div>
  </body>
</html>
