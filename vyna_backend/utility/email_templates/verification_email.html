<html>
  <head>
    <link
      href="https://fonts.googleapis.com/icon?family=/Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div
      class="card"
      style="
        width: auto;
        height: auto;
        margin: 20 auto;
        font-family: Arial, sans-serif;
        background-color: #f0f1f5;
      "
    >
      <div class="card-body">
        <div
          style="
            height: auto;
            margin: 0 auto;
            padding: 8;
            background-color: white;
          "
        >
          <div
            align="center"
            style="
              margin-top: 50px;
              border-color: #0f5a94;
              border-radius: 20px;
              border-width: 20px;
            "
          >
          </div>

          <div align="center">
            <p style="font-size: 16px">Password Reset Link</p>
            <a href="{otpLink}">
              <button
                style="
                  background-color: blue;
                  color: white;
                  border: none;
                  font-size: 20px;
                  border-radius: 4px;
                  padding: 8px 17px 8px 17px;
                "
              >
                Click here to reset your password
              </button>
            </a>
          </div>
          <br />
          <!-- <div align="center">
            <p style="font-size: 12px; word-wrap: break-word; opacity: 0.6">
              {otp}
            </p>
          </div> -->
        </div>
      </div>
    </div>
  </body>
</html>
