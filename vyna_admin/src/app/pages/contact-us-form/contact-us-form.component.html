<body class="ltr main-body leftmenu">
    <!-- Page -->
    <div class="page">
        <!-- Main Header-->
        <div class="main-header side-header sticky">
            <div class="main-container container-fluid">
                <div class="main-header-left">
                    <a class="main-header-menu-icon" [routerLink]="['/pages/dashboard']"
                        id="mainSidebarToggle"><span></span></a>

                </div>
                <div class="main-header-center">
                    <div class="responsive-logo">

                    </div>
                    <div class="input-group">
                        <h5 class="text-primary fw-bold mb-0">
                            <i class="fe fe-phone-call me-2"></i> Contact Us
                        </h5>
                    </div>
                </div>
                <div class="main-header-right">
                    <button class="navbar-toggler navresponsive-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent-4" aria-controls="navbarSupportedContent-4"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <i class="fe fe-more-vertical header-icons navbar-toggler-icon"></i>
                    </button>
                    <div class="navbar navbar-expand-lg nav nav-item navbar-nav-right responsive-navbar navbar-dark">
                        <div class="collapse navbar-collapse" id="navbarSupportedContent-4">
                            <div class="d-flex order-lg-2 ms-auto">
                                <div class="dropdown header-search">
                                    <p class="mb-0"><i class="fe fe-mail me-1"></i> Contact Us</p>
                                </div>
                                <app-header></app-header>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- End Main Header-->

        <!-- Sidemenu -->
        <app-sidebar></app-sidebar>
        <!-- End Sidemenu -->

        <!-- Main Content-->
        <div class="main-content side-content pt-0">
            <div class="main-container container-fluid">
                <div class="inner-body">
                    <div class="d-flex justify-content-end mb-4">
                        <div class="position-relative" style="width: 280px;">
                            <input type="text" class="form-control ps-5 pe-4" [(ngModel)]="searchText"
                                placeholder="Search..." />

                            <!-- Search Icon (left) -->
                            <i
                                class="fa fa-search position-absolute top-50 start-0 translate-middle-y ms-2 text-muted"></i>

                            <!-- Clear Icon (right) -->
                            <i class="fa fa-times position-absolute top-50 end-0 translate-middle-y me-2 text-muted"
                                style="cursor: pointer;" (click)="searchText = ''" *ngIf="searchText">
                            </i>
                        </div>
                    </div>
                    <!-- Page Header -->
                    <div class="page-header d-flex justify-content-between align-items-center mt-3 mb-4">

                    </div>

                    <!-- Table Section -->
                    <div class="row row-sm">
                        <div class="col-md-12">
                            <div class="card custom-card shadow-sm">
                                <div class="card-body">
                                    <div class="table-responsive text-center">
                                        <table class="table table-bordered table-hover table-striped text-nowrap">
                                            <thead class="table-light">
                                                <tr>
                                                    <th>S NO.</th>
                                                    <th>Name</th>
                                                    <th>Email</th>
                                                    <th>Mobile Number</th>
                                                    <th>Message</th>

                                                    <th>Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr *ngFor="let user of dataList  | filter:searchText;; let i = index">
                                                    <td>{{ i + 1 }}</td>
                                                    <td>{{ user.name || 'NA' }}</td>
                                                    <td>{{ user.email || 'NA' }}</td>
                                                    <td>{{ user.mobile_number || 'NA' }}</td>
                               <td>
  {{ user.message.length > 50 ? (user.message | slice:0:50) + '...' : user.message }}
</td>



                                                    <!-- <td>
                                                        <a [routerLink]="['/pages/contact-us-view', user._id]"
                                                            class="btn btn-sm btn-outline-primary">
                                                            <i class="fe fe-eye"></i> View
                                                        </a>
                                                          <button mat-icon-button class="delete-button" title="Delete"
                                                            (click)="DeleteAccount(user._id)">
                                                            <mat-icon>delete</mat-icon>
                                                        </button>
                                                    </td> -->

                                                    <td>
                                                        <a [routerLink]="['/pages/contact-us-view', user._id]"
                                                            class="btn btn-sm btn-outline-primary me-2">
                                                            <i class="fe fe-eye"></i> View
                                                        </a>

                                                        <button mat-icon-button class="delete-button" title="Delete"
                                                            (click)="DeleteAccount(user._id)">
                                                            <mat-icon>delete</mat-icon>
                                                        </button>
                                                    </td>

                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Pagination -->

                    <mat-paginator [length]="totalCount" [pageSize]="limit" [pageSizeOptions]="[5, 10, 20,30,40]"
                        (page)="onPageChange($event)">
                    </mat-paginator>
                </div>
            </div>
        </div>
        <!-- End Main Content-->

        <!-- Main Footer-->
        <app-footer></app-footer>
        <!--End Footer-->
    </div>
</body>
