    <script>
        // Initialize map
        const map = L.map('dealerMap').setView([28.6139, 77.2090], 11);

        // Add tile layer (OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Custom icon
        const dealerIcon = L.icon({
            iconUrl: 'https://cdn0.iconfinder.com/data/icons/small-n-flat/24/678111-map-marker-512.png',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        // Add markers for each dealer
        document.querySelectorAll('.dealer-card').forEach(card => {
            const lat = parseFloat(card.dataset.lat);
            const lng = parseFloat(card.dataset.lng);
            const name = card.querySelector('.dealer-name').textContent;
            const address = card.querySelector('.dealer-address').textContent.trim().replace(/\n/g, '<br>');

            const marker = L.marker([lat, lng], { icon: dealerIcon }).addTo(map)
                .bindPopup(`<b>${name}</b><br>${address}`);

            // Highlight card when marker is clicked
            marker.on('click', function () {
                document.querySelectorAll('.dealer-card').forEach(c => c.style.backgroundColor = '');
                card.style.backgroundColor = '#f0f7ff';
                card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });

            // Highlight marker when card is clicked
            card.addEventListener('click', function () {
                map.setView([lat, lng], 15);
                marker.openPopup();
            });
        });

        // Form submission handler
        document.getElementById('dealerSearchForm').addEventListener('submit', function (e) {
            e.preventDefault();
            // In a real implementation, you would filter dealers based on search criteria
            alert('Search functionality would filter dealers based on your criteria in a real implementation');
        });
    </script>
    <script>

        gsap.registerPlugin(ScrollTrigger);


        // Media query helper function
        function isAboveMinWidth() {
            return window.innerWidth > 500;
        }

        // Initialize stacking navigation
        function initStackingNav() {
            const cards = document.querySelectorAll(".stack_card-copy");
            if (!cards) return;

            cards.forEach((card, index) => {
                let previousCard = card.previousElementSibling;

                // Create the timeline but pause it initially
                let tl = gsap.timeline({
                    scrollTrigger: {
                        trigger: card,
                        start: "top 65%",
                        end: "top top",
                        scrub: 1,
                        onUpdate: (self) => {
                            // Only apply animation if screen width is above 500px
                            if (!isAboveMinWidth()) {
                                // Reset the card to its original state
                                gsap.set(previousCard, {
                                    scale: 1,
                                    filter: "blur(0px)",
                                    y: 0
                                });
                            }
                        }
                    }
                });

                // Add the animation
                tl.fromTo(previousCard,
                    {
                        scale: 1,
                        filter: "blur(0px)",
                        y: 0
                    },
                    {
                        scale: () => isAboveMinWidth() ? 0.85 : 1,
                        filter: "blur(0px)",
                        y: () => isAboveMinWidth() ? -80 + (index * 20) : 0
                    }
                );
            });
        }

        // Initialize animation
        initStackingNav();

        // Handle window resize
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                // Refresh ScrollTrigger and reinitialize on resize
                ScrollTrigger.refresh();
                initStackingNav();
            }, 250);
        });



        document.addEventListener("DOMContentLoaded", function () {
            var thumbsSwiper = new Swiper('.tf-product-media-thumbs', {
                direction: 'vertical',
                spaceBetween: 10,
                slidesPerView: 4,
                watchSlidesProgress: true,
            });

            var mainSwiper = new Swiper('.tf-product-media-main', {
                spaceBetween: 10,
                thumbs: {
                    swiper: thumbsSwiper
                }
            });
        });




    </script>
