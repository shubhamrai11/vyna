<body class="ltr main-body leftmenu error-1">


    <!-- Page -->
    <div class="page main-signin-wrapper">

        <!-- Row -->
        <div class="row signpages text-center">
            <div class="col-md-12">
                <div class="card">
                    <div class="row row-sm">
                        <div class="col-lg-6 col-xl-4 d-none d-lg-block text-center bg-primary details">
                            <div class="mt-5 pt-4 p-2 pos-absolute">
                                <img src="./assets/img/brand/logo-light.png"
                                    class="d-lg-none header-brand-img text-start float-start mb-4 error-logo-light"
                                    alt="logo">
                                <img src="./assets/img/brand/logo-light.png"
                                    class=" d-lg-none header-brand-img text-start float-start mb-4 error-logo"
                                    alt="logo">
                                <div class="clearfix"></div>
                                <img src="./assets/img/brand/logo-light.png" class=" mb-0" alt="user" style="width:70%">
                                <h5 class="mt-4 text-white">Change Your Password</h5>
                                <span class="tx-white-6 tx-13 mb-5 mt-xl-0">Signup to create, discover and connect with
                                    the global community</span>
                            </div>
                        </div>
                        <div class="col-lg-6 col-xl-8 col-xs-12 col-sm-12 login_form ">
                            <div class="main-container container-fluid">
                                <div class="row row-sm">
                                    <div class="card-body mt-2 mb-2">
                                        <img src="./assets/img/brand/logo-light.png"
                                            class=" d-lg-none header-brand-img text-start float-start mb-4" alt="logo">
                                        <div class="clearfix"></div>
                                        <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
                                            <h5 class="text-start mb-2">Change Your Password</h5>
                                            <div class="row">
                                                <div class="col-md-12">
                                                    <div class="form-group text-start">
                                                        <label>Email</label>
                                                        <input class="form-control" placeholder="Enter your email"
                                                            formControlName="email" type="email">
                                                        <mat-error class="danger"
                                                            *ngIf="changePasswordForm.get('email')?.hasError('required') && changePasswordForm.get('email')?.touched">
                                                            Email is required.
                                                        </mat-error>
                                                        <mat-error class="danger"
                                                        *ngIf="changePasswordForm.get('email')?.hasError('email') && changePasswordForm.get('email')?.touched">
                                                        Invalid Email Format.
                                                    </mat-error>
                                                    </div>
                                                </div>
                                                <div class="col-md-12">
                                                    <div class="form-group text-start">
                                                        <label>New Password</label>
                                                        <input class="form-control" placeholder="Enter your password"
                                                            formControlName="password" type="password">
                                                        <mat-error class="danger"
                                                            *ngIf="changePasswordForm.get('password')?.hasError('required') && changePasswordForm.get('password')?.touched">
                                                            Password is required.
                                                        </mat-error>
                                                    </div>
                                                </div>
                                                <div class="col-md-12">
                                                    <div class="form-group text-start">
                                                        <label>Confirm Password</label>
                                                        <input class="form-control" placeholder="Enter your password"
                                                            formControlName="confirmation" type="password">
                                                        <mat-error class="danger"
                                                            *ngIf="changePasswordForm.get('confirmation')?.hasError('required') && changePasswordForm.get('confirmation')?.touched">
                                                            Confirmation is required.
                                                        </mat-error>
                                                        <mat-error class="danger" >
                                                            <mat-error *ngIf="changePasswordForm.hasError('passwordMismatch') && changePasswordForm.get('confirmation')?.touched">
                                                                Password and confirmation must match.
                                                              </mat-error>
                                                        </mat-error>
                                                         
                                                    </div>
                                                </div>
                                            </div>
                                            <button type="submit" class="btn ripple btn-main-primary btn-block">Change
                                                Password</button>
                                        </form>

                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- End Row -->

    </div>
    <!-- End Page -->
